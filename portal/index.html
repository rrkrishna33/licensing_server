<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Licensing Portal — Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Licensing Portal</h1>
      <p>Sign in with your admin credentials to continue.</p>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="admin" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div id="errorMsg" class="error-msg hidden"></div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="margin-top:.5rem">Sign in</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
